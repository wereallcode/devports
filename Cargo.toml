[package]
name = "devports"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A CLI to manage ports held by development servers."
license = "MIT"
repository = "https://github.com/wereallcode/devports"
authors = ["wereallcode"]
publish = false

[dependencies]
libc = "0.2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
unicode-width = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
